<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 374" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <style>
      .ink{fill:#1f2937;} .muted{fill:#64748b;} .title{font-weight:700;}
      .h{font-size:18px;} .lbl{font-size:14px;} .nm{font-size:13px;}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;}
      .pull{stroke:#1f2937;stroke-width:2.4;fill:none;}
      .gray{fill:#94a3b8;}
    </style>
  </defs>
  <text class="ink h title" x="222" y="42" text-anchor="middle">A related word is nearby</text>
  <rect class="panel" x="30" y="60" width="385" height="300" rx="12"/>
  <circle class="gray" cx="150" cy="150" r="7"/><text class="nm muted" x="150" y="138" text-anchor="middle">truck</text>
  <circle class="gray" cx="300" cy="250" r="7"/><text class="nm muted" x="300" y="272" text-anchor="middle">shipment</text>
  <circle cx="225" cy="215" r="11" fill="#1f2937"/>
  <text class="nm muted" x="225" y="246" text-anchor="middle">the model is here</text>
  <circle cx="282" cy="178" r="10" fill="#0d9488"/>
  <text class="nm title" x="300" y="166" text-anchor="middle" fill="#0d9488">freight</text>
  <path class="pull" d="M236,208 L272,184" marker-end="url(#pn)"/>
  <text class="lbl title" x="200" y="92" text-anchor="middle" fill="#0d9488">nearest = freight &#10003;</text>
  <text class="ink h title" x="697" y="42" text-anchor="middle">Nothing relevant is near</text>
  <rect class="panel" x="505" y="60" width="385" height="300" rx="12"/>
  <circle class="gray" cx="565" cy="110" r="6"/><text class="nm muted" x="565" y="100" text-anchor="middle">truck</text>
  <circle class="gray" cx="600" cy="128" r="6"/>
  <circle class="gray" cx="585" cy="145" r="6"/><text class="nm muted" x="612" y="158" text-anchor="middle">freight, shipment</text>
  <text class="nm muted" x="600" y="186" text-anchor="middle">(all far away)</text>
  <circle cx="690" cy="265" r="11" fill="#1f2937"/>
  <text class="nm muted" x="690" y="296" text-anchor="middle">the model is here</text>
  <circle cx="765" cy="220" r="10" fill="#ef6b5e"/>
  <text class="nm title" x="785" y="212" text-anchor="middle" fill="#ef6b5e">cat</text>
  <path class="pull" d="M700,258 L755,226" marker-end="url(#pn)"/>
  <text class="lbl title" x="700" y="340" text-anchor="middle" fill="#ef6b5e">nearest = cat &#10007; (hallucination)</text>
</svg>
