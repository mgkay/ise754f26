<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="vl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="vlr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6b5e"/>
    </marker>
    <style>
      .ink{fill:#1f2937;} .muted{fill:#64748b;} .title{font-weight:700;}
      .lbl{font-size:15px;} .sm{font-size:12px;}
      .node{fill:#f8fafc;stroke:#1f2937;stroke-width:2.2;}
      .tool{fill:#ffffff;stroke:#0d9488;stroke-width:2;}
      .flow{stroke:#1f2937;stroke-width:2.2;fill:none;}
      .fail{stroke:#ef6b5e;stroke-width:2.4;fill:none;}
    </style>
  </defs>
  <text class="ink lbl title" x="150" y="42" text-anchor="middle">Tools feed the window</text>
  <rect class="tool" x="36" y="64"  width="228" height="38" rx="8"/>
  <text class="ink sm" x="150" y="88"  text-anchor="middle">web search: current facts</text>
  <rect class="tool" x="36" y="110" width="228" height="38" rx="8"/>
  <text class="ink sm" x="150" y="134" text-anchor="middle">code sandbox: runs it for real</text>
  <rect class="tool" x="36" y="156" width="228" height="38" rx="8"/>
  <text class="ink sm" x="150" y="180" text-anchor="middle">files / repo: your code</text>
  <path class="flow" d="M266,130 C330,130 330,224 380,224" marker-end="url(#vl)"/>
  <rect class="node" x="384" y="64" width="200" height="56" rx="10"/>
  <text class="ink lbl title" x="484" y="90"  text-anchor="middle">Goal = unit test</text>
  <text class="muted sm"      x="484" y="108" text-anchor="middle">a checkable target</text>
  <rect class="node" x="384" y="196" width="200" height="56" rx="10"/>
  <text class="ink lbl title" x="484" y="222" text-anchor="middle">Model writes code</text>
  <text class="muted sm"      x="484" y="240" text-anchor="middle">or edits a file</text>
  <rect x="356" y="324" width="256" height="100" rx="12" fill="#e8f6f4" stroke="#0d9488" stroke-width="3"/>
  <g transform="translate(372,340)" fill="#0d9488">
    <circle cx="9" cy="9" r="6"/><circle cx="9" cy="9" r="2.4" fill="#e8f6f4"/>
    <g stroke="#0d9488" stroke-width="2.4">
      <line x1="9" y1="0" x2="9" y2="3"/><line x1="9" y1="15" x2="9" y2="18"/>
      <line x1="0" y1="9" x2="3" y2="9"/><line x1="15" y1="9" x2="18" y2="9"/>
    </g>
  </g>
  <text x="484" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#0d9488">HOOK</text>
  <text class="ink sm" x="484" y="378" text-anchor="middle">your command runs on that event</text>
  <text class="muted sm" x="484" y="396" text-anchor="middle">tests &#183; formatter &#183; guard</text>
  <text class="ink sm" x="484" y="414" text-anchor="middle">nonzero exit blocks the action</text>
  <path class="flow" d="M484,120 L484,194" marker-end="url(#vl)"/>
  <path class="flow" d="M484,252 L484,322" marker-end="url(#vl)"/>
  <text class="muted sm" x="556" y="290" text-anchor="middle">the action</text>
  <text class="muted sm" x="556" y="304" text-anchor="middle">is an event</text>
  <path class="flow" d="M612,374 L660,374" marker-end="url(#vl)"/>
  <rect x="662" y="350" width="172" height="48" rx="10" fill="#0d9488"/>
  <text x="748" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">&#10003; passes &#8594; done</text>
  <path class="fail" d="M376,360 C292,360 292,228 382,228" marker-end="url(#vlr)"/>
  <text class="sm title" x="248" y="300" text-anchor="middle" fill="#ef6b5e">blocked:</text>
  <text class="sm title" x="248" y="316" text-anchor="middle" fill="#ef6b5e">fix, retry</text>
</svg>
