<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="te" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <style>
      .ink{fill:#1f2937;} .muted{fill:#64748b;} .title{font-weight:700;}
      .lbl{font-size:15px;} .cap{font-size:13.5px;} .sm{font-size:12px;}
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2.2;}
      .flow{stroke:#1f2937;stroke-width:2.2;fill:none;}
      .cell{fill:#ffffff;stroke:#cbd5e1;stroke-width:1;}
      .hot{fill:#0d9488;}
    </style>
  </defs>

  <!-- stage 1: the token -->
  <rect class="box" x="24" y="120" width="150" height="56" rx="10"/>
  <text class="ink lbl title" x="99" y="154" text-anchor="middle">"freight"</text>
  <text class="muted sm" x="99" y="196" text-anchor="middle">one token</text>
  <path class="flow" d="M178,148 L246,148" marker-end="url(#te)"/>
  <text class="muted sm" x="212" y="138" text-anchor="middle">look up</text>

  <!-- stage 2: embedding table -->
  <text class="ink cap title" x="372" y="36" text-anchor="middle">embedding table</text>
  <text class="muted sm" x="372" y="54" text-anchor="middle">vocabulary &#215; 768</text>
  <g>
    <!-- rows -->
    <rect class="cell" x="262" y="70" width="220" height="22"/>
    <rect class="cell" x="262" y="92" width="220" height="22"/>
    <rect class="hot"  x="262" y="114" width="220" height="22"/>
    <rect class="cell" x="262" y="136" width="220" height="22"/>
    <rect class="cell" x="262" y="158" width="220" height="22"/>
    <rect class="cell" x="262" y="180" width="220" height="22"/>
    <rect class="cell" x="262" y="202" width="220" height="22"/>
    <!-- vertical separators to suggest many numbers -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="306" y1="70" x2="306" y2="224"/>
      <line x1="350" y1="70" x2="350" y2="224"/>
      <line x1="394" y1="70" x2="394" y2="224"/>
      <line x1="438" y1="70" x2="438" y2="224"/>
    </g>
    <text class="sm" fill="#ffffff" x="372" y="129" text-anchor="middle">0.8&#160;&#160;0.2&#160;&#160;&#8230;&#160;&#160;0.1</text>
  </g>
  <text class="hot sm title" x="372" y="244" text-anchor="middle">the "freight" row = its vector</text>
  <path class="flow" d="M486,148 L560,148" marker-end="url(#te)"/>
  <text class="muted sm" x="523" y="138" text-anchor="middle">plot it</text>

  <!-- stage 3: meaning space -->
  <rect x="576" y="58" width="300" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="ink cap title" x="726" y="46" text-anchor="middle">meaning space</text>
  <!-- cluster of related words -->
  <circle cx="690" cy="120" r="6" fill="#94a3b8"/>
  <text class="sm muted" x="690" y="110" text-anchor="middle">truck</text>
  <circle cx="724" cy="138" r="7" fill="#0d9488"/>
  <text class="sm ink title" x="724" y="160" text-anchor="middle" fill="#0d9488">freight</text>
  <circle cx="704" cy="150" r="6" fill="#94a3b8"/>
  <text class="sm muted" x="676" y="172" text-anchor="middle">shipment</text>
  <!-- far-away word -->
  <circle cx="828" cy="238" r="6" fill="#94a3b8"/>
  <text class="sm muted" x="828" y="228" text-anchor="middle">cat</text>

  <!-- caption -->
  <text class="ink cap title" x="450" y="308" text-anchor="middle">A token is a key into a table. Its row is a vector, a point in space.</text>
  <text class="muted cap" x="450" y="328" text-anchor="middle">Nearby points mean similar things; distant ones do not.</text>
</svg>
