<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="nt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <style>
      .ink{fill:#1f2937;} .muted{fill:#64748b;}
      .sm{font-size:12px;} .title{font-weight:700;}
      .zlbl{font-size:11.5px;font-weight:700;fill:#0d9488;}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;}
      .axis{stroke:#cbd5e1;stroke-width:1.4;}
      .teal{fill:#0d9488;} .coral{fill:#ef6b5e;}
      .zoom{fill:none;stroke:#0d9488;stroke-width:1.8;stroke-dasharray:5 4;}
      .ptitle{font-size:14px;font-weight:700;fill:#1f2937;}
    </style>
  </defs>

  <!-- LEFT: before training (scattered) -->
  <text class="ptitle" x="225" y="40" text-anchor="middle">Before training</text>
  <rect class="panel" x="40" y="56" width="370" height="252" rx="10"/>
  <line class="axis" x1="90" y1="285" x2="385" y2="285"/>
  <line class="axis" x1="90" y1="80"  x2="90"  y2="285"/>
  <text class="sm muted" x="385" y="301" text-anchor="end">meaning</text>
  <circle class="teal" cx="150" cy="120" r="11"/>
  <circle class="teal" cx="330" cy="150" r="11"/>
  <circle class="teal" cx="235" cy="248" r="11"/>
  <circle class="teal" cx="300" cy="205" r="11"/>
  <rect class="coral" x="175" y="168" width="22" height="22" rx="3"/>
  <rect class="coral" x="120" y="223" width="22" height="22" rx="3"/>
  <rect class="coral" x="345" y="98"  width="22" height="22" rx="3"/>
  <text class="sm muted" x="225" y="300" text-anchor="middle">the tokens start scattered</text>

  <!-- arrow -->
  <path d="M418,182 L498,182" stroke="#1f2937" stroke-width="2.4" marker-end="url(#nt)"/>
  <text class="sm ink title" x="458" y="168" text-anchor="middle">training</text>
  <text class="sm muted" x="450" y="200" text-anchor="middle">moves the points</text>
  <text class="sm muted" x="458" y="216" text-anchor="middle">and the line</text>

  <!-- RIGHT: after training (two clusters + boundary) -->
  <text class="ptitle" x="690" y="40" text-anchor="middle">After training</text>
  <rect class="panel" x="505" y="56" width="370" height="252" rx="10"/>
  <line class="axis" x1="555" y1="285" x2="850" y2="285"/>
  <line class="axis" x1="555" y1="80"  x2="555" y2="285"/>
  <text class="sm muted" x="850" y="301" text-anchor="end">meaning</text>
  <line x1="648" y1="92" x2="712" y2="280" stroke="#0d9488" stroke-width="3"/>
  <!-- place cluster (wait) -->
  <rect class="coral" x="590" y="108" width="22" height="22" rx="3"/>
  <rect class="coral" x="618" y="142" width="22" height="22" rx="3"/>
  <rect class="coral" x="584" y="170" width="22" height="22" rx="3"/>
  <!-- cargo cluster (go) -->
  <circle class="teal" cx="765" cy="205" r="11"/>
  <circle class="teal" cx="795" cy="222" r="11"/>
  <circle class="teal" cx="768" cy="242" r="11"/>
  <circle class="teal" cx="800" cy="250" r="11"/>
  <rect class="zoom" x="742" y="188" width="82" height="80" rx="8"/>
  <text class="zlbl" x="783" y="182" text-anchor="middle">cargo cluster</text>
  <circle cx="845" cy="208" r="7" fill="none" stroke="#0d9488" stroke-width="2"/>
  <line x1="850" y1="213" x2="858" y2="221" stroke="#0d9488" stroke-width="2"/>
  <text class="zlbl" x="846" y="242" text-anchor="middle">zoom</text>

  <text class="sm muted" x="690" y="300" text-anchor="middle">two clusters, one line splits them</text>

  <text class="sm muted" x="450" y="340" text-anchor="middle">circles = words followed by go (cargo: van, rig, parcel, pallet)&#160;&#160; squares = words followed by wait (places)</text>
  <text class="sm" fill="#0d9488" x="450" y="364" text-anchor="middle">the cargo cluster is magnified next, to show the structure inside it</text>
</svg>
