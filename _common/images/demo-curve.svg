<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="sans-serif" font-size="12">
  <rect width="400" height="250" fill="#fcfcfc" stroke="#ccc"/>
  <!-- axes -->
  <line x1="50" y1="210" x2="370" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="50" y2="30" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="240" text-anchor="middle" fill="#333">shipment size  q</text>
  <text x="20" y="120" text-anchor="middle" fill="#333" transform="rotate(-90, 20, 120)">cost</text>
  <!-- TC = a/q (transport, decreasing) -->
  <path d="M 70 50 Q 110 120 200 170 T 360 195" fill="none" stroke="#1a73e8" stroke-width="2"/>
  <text x="320" y="180" fill="#1a73e8">TC</text>
  <!-- IC = b*q (inventory, increasing) -->
  <line x1="50" y1="210" x2="360" y2="50" stroke="#d73a49" stroke-width="2"/>
  <text x="345" y="60" fill="#d73a49">IC</text>
  <!-- TLC = TC + IC (U-curve) -->
  <path d="M 70 55 Q 130 120 180 110 Q 260 120 360 80" fill="none" stroke="#6f42c1" stroke-width="2.5"/>
  <text x="270" y="105" fill="#6f42c1">TLC = TC + IC</text>
  <!-- optimum marker -->
  <circle cx="180" cy="110" r="4" fill="#6f42c1"/>
  <line x1="180" y1="110" x2="180" y2="210" stroke="#6f42c1" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="180" y="225" text-anchor="middle" fill="#6f42c1">q*</text>
</svg>
